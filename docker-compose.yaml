services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: evoting_app
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: evoting_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U evoting_app -d evoting_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:3001
    environment:
      BACKEND_URL: http://backend:3001
      # Address voters' phones use to open the QR login link. localhost will NOT
      # work from a phone: use this computer's LAN IP or a real domain.
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
